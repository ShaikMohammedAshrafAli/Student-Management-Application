spring.application.name=auth-service
server.port=8080

# ---- MySQL Datasource ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:auth_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
# IMPORTANT: override this via env var in real deployments. This default is for local dev only.
jwt.secret=${JWT_SECRET:MzM0NmM4NDNhOWM5NDcyM2FhZmY3NmY2ZGRhYTQ5ZjM0Njc4OTBhYmNkZWYxMjM0NTY3ODkwYWJjZGVm}
jwt.access-token-expiry-ms=${JWT_ACCESS_EXPIRY:900000}
jwt.refresh-token-expiry-ms=${JWT_REFRESH_EXPIRY:604800000}

# ---- Swagger ----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info,metrics

# ---- Logging ----
logging.level.com.example.authservice=DEBUG
