version: "3.8"

services:
  mysql-student:
    image: mysql:8.0
    container_name: mysql-student
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: student_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_student_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - student-net

  mysql-enrollment:
    image: mysql:8.0
    container_name: mysql-enrollment
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: enrollment_db
    ports:
      - "3308:3306"
    volumes:
      - mysql_enrollment_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - student-net

  student-service:
    build: ./student-service
    container_name: student-service
    restart: unless-stopped
    depends_on:
      mysql-student:
        condition: service_healthy
    environment:
      DB_HOST: mysql-student
      DB_PORT: 3306
      DB_NAME: student_db
      DB_USER: root
      DB_PASSWORD: root
    ports:
      - "8081:8081"
    networks:
      - student-net

  enrollment-service:
    build: ./enrollment-service
    container_name: enrollment-service
    restart: unless-stopped
    depends_on:
      mysql-enrollment:
        condition: service_healthy
      student-service:
        condition: service_started
    environment:
      DB_HOST: mysql-enrollment
      DB_PORT: 3306
      DB_NAME: enrollment_db
      DB_USER: root
      DB_PASSWORD: root
      STUDENT_SERVICE_URL: http://student-service:8081
    ports:
      - "8082:8082"
    networks:
      - student-net

networks:
  student-net:
    driver: bridge

volumes:
  mysql_student_data:
  mysql_enrollment_data:
