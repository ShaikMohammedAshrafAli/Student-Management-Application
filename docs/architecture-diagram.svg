<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowDashed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="#F5F7FB"/>

  <text x="600" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">
    Student Management System — Architecture
  </text>

  <!-- Frontend -->
  <rect x="500" y="55" width="200" height="55" rx="10" fill="#FFFFFF" stroke="#3454D1" stroke-width="2"/>
  <text x="600" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#3454D1">React Frontend</text>
  <text x="600" y="96" text-anchor="middle" font-size="10" fill="#64748B">Vite + MUI (browser)</text>

  <!-- Arrow: frontend -> gateway -->
  <line x1="600" y1="110" x2="600" y2="145" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- API Gateway -->
  <rect x="480" y="148" width="240" height="60" rx="10" fill="#3454D1"/>
  <text x="600" y="173" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">api-gateway :9000</text>
  <text x="600" y="192" text-anchor="middle" font-size="10" fill="#DCE3FA">Routing · JWT check · CORS</text>

  <!-- Service row -->
  <!-- auth-service -->
  <g>
    <rect x="85" y="270" width="190" height="65" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="180" y="296" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">auth-service</text>
    <text x="180" y="313" text-anchor="middle" font-size="10" fill="#64748B">:8080 · JWT issuance, roles</text>
  </g>

  <!-- student-service -->
  <g>
    <rect x="295" y="270" width="190" height="65" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="390" y="296" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">student-service</text>
    <text x="390" y="313" text-anchor="middle" font-size="10" fill="#64748B">:8081 · Student CRUD</text>
  </g>

  <!-- course-service -->
  <g>
    <rect x="505" y="270" width="190" height="65" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="600" y="296" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">course-service</text>
    <text x="600" y="313" text-anchor="middle" font-size="10" fill="#64748B">:8083 · Course catalog</text>
  </g>

  <!-- enrollment-service -->
  <g>
    <rect x="715" y="270" width="190" height="65" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="810" y="296" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">enrollment-service</text>
    <text x="810" y="313" text-anchor="middle" font-size="10" fill="#64748B">:8082 · Enrollment lifecycle</text>
  </g>

  <!-- grade-service -->
  <g>
    <rect x="925" y="270" width="190" height="65" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="1020" y="296" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">grade-service</text>
    <text x="1020" y="313" text-anchor="middle" font-size="10" fill="#64748B">:8084 · Grades, GPA/CGPA</text>
  </g>

  <!-- Arrows: gateway -> services -->
  <line x1="560" y1="208" x2="180" y2="268" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="580" y1="208" x2="390" y2="268" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="600" y1="208" x2="600" y2="268" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="620" y1="208" x2="810" y2="268" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="640" y1="208" x2="1020" y2="268" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Inter-service calls (dashed, purple) -->
  <path d="M 715,320 C 600,360 500,360 486,320" fill="none" stroke="#7C3AED" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrowDashed)"/>
  <path d="M 745,335 C 700,400 500,400 486,336" fill="none" stroke="#7C3AED" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrowDashed)"/>
  <path d="M 925,320 C 850,365 815,365 812,322" fill="none" stroke="#7C3AED" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrowDashed)"/>
  <path d="M 955,335 C 800,420 650,420 602,338" fill="none" stroke="#7C3AED" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrowDashed)"/>

  <text x="600" y="440" text-anchor="middle" font-size="10" fill="#7C3AED">
    ⋯⋯ inter-service REST calls (enrollment→student, enrollment→course, grade→enrollment, grade→course), forwarding the caller's own JWT
  </text>

  <!-- Databases -->
  <g>
    <ellipse cx="180" cy="475" rx="70" ry="18" fill="#0EA5A4"/>
    <rect x="110" y="475" width="140" height="34" fill="#0EA5A4"/>
    <ellipse cx="180" cy="509" rx="70" ry="18" fill="#0B8A89"/>
    <text x="180" y="497" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">auth_db</text>
  </g>
  <g>
    <ellipse cx="390" cy="475" rx="70" ry="18" fill="#0EA5A4"/>
    <rect x="320" y="475" width="140" height="34" fill="#0EA5A4"/>
    <ellipse cx="390" cy="509" rx="70" ry="18" fill="#0B8A89"/>
    <text x="390" y="497" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">student_db</text>
  </g>
  <g>
    <ellipse cx="600" cy="475" rx="70" ry="18" fill="#0EA5A4"/>
    <rect x="530" y="475" width="140" height="34" fill="#0EA5A4"/>
    <ellipse cx="600" cy="509" rx="70" ry="18" fill="#0B8A89"/>
    <text x="600" y="497" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">course_db</text>
  </g>
  <g>
    <ellipse cx="810" cy="475" rx="70" ry="18" fill="#0EA5A4"/>
    <rect x="740" y="475" width="140" height="34" fill="#0EA5A4"/>
    <ellipse cx="810" cy="509" rx="70" ry="18" fill="#0B8A89"/>
    <text x="810" y="497" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">enrollment_db</text>
  </g>
  <g>
    <ellipse cx="1020" cy="475" rx="70" ry="18" fill="#0EA5A4"/>
    <rect x="950" y="475" width="140" height="34" fill="#0EA5A4"/>
    <ellipse cx="1020" cy="509" rx="70" ry="18" fill="#0B8A89"/>
    <text x="1020" y="497" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">grade_db</text>
  </g>

  <!-- Arrows: service -> own db -->
  <line x1="180" y1="335" x2="180" y2="473" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="390" y1="335" x2="390" y2="473" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="600" y1="335" x2="600" y2="473" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="810" y1="335" x2="810" y2="473" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="1020" y1="335" x2="1020" y2="473" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <g transform="translate(85, 555)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="38" y="4" font-size="11" fill="#334155">Request routing / DB access</text>

    <line x1="290" y1="0" x2="320" y2="0" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowDashed)"/>
    <text x="328" y="4" font-size="11" fill="#334155">Inter-service REST call (pass-through JWT)</text>
  </g>

  <text x="600" y="595" text-anchor="middle" font-size="10" fill="#94A3B8">
    Every backend service independently re-validates the JWT it receives - the gateway's check is defense in depth, not the sole boundary.
  </text>
</svg>
